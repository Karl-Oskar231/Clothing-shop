<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main>
    <h1>Clothing Shop</h1>
    <section class="grid">
        <button id="hat-back" class="triangle-left"></button>
        <div><img id="hatsImg" src=https://i.imgur.com/qCcovAh.png alt="Hat"></div>
        <button id="next-hat" class="triangle-right"></button>
        <button id="shirt-back" class="triangle-left"></button>
        <div><img id="shirtsImg" src=https://i.imgur.com/eroo5Ca.png alt="Shirt"></div>
        <button id="next-shirt" class="triangle-right"></button>
        <button id="pants-back" class="triangle-left"></button>
        <div><img id="pantsImg" src=https://i.imgur.com/TqKPjuX.png alt="Pants"></div>
        <button id="next-pants" class="triangle-right"></button>
    </section>
    <button id="randomize" class="randomize-button">Randomize</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
